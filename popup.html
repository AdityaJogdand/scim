<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 360px;
      height: 420px;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 13px;
      background: #fff;
      color: #000;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid #000;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .title { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; text-transform: uppercase; }

    .status-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #666;
    }

    .main {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #task {
      width: 100%;
      padding: 10px 0;
      background: none;
      border: none;
      border-bottom: 1px solid #ccc;
      font-size: 14px;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      color: #000;
      outline: none;
      transition: border-color 0.15s;
    }

    #task::placeholder { color: #aaa; }
    #task:focus { border-color: #000; }

    #run {
      width: 100%;
      padding: 10px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 0;
      font-size: 13px;
      font-weight: 700;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      cursor: pointer;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    #run:disabled { background: #ccc; color: #999; cursor: not-allowed; }

    .output {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .output-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #999;
    }

    #status {
      flex: 1;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: #666;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-y: auto;
    }

    .footer {
      padding: 12px 20px;
      border-top: 1px solid #eee;
      font-size: 10px;
      font-weight: 700;
      color: #ddd;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Scrim</span>
    <span class="status-label" id="conn-label">Ready</span>
  </div>

  <div class="main">
    <input id="task" type="text" placeholder="What should I do on this page?" autofocus>
    <button id="run">Run</button>

    <div class="output">
      <span class="output-label">Output</span>
      <div id="status"></div>
    </div>
  </div>

  <div class="footer">scrim</div>
  <script type="module" src="dist/popup/index.js"></script>
</body>
</html>
